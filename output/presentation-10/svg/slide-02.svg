<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F4F3EC"/><text x="64" y="102.78" fill="#142F32" font-family="Arial" font-size="46" font-weight="700" text-anchor="start">The problem and the reason for this study</text><text x="64" y="228.92000000000002" fill="#142F32" font-family="Arial" font-size="44" font-weight="700" text-anchor="start">Can a deliberate signal survive</text><text x="64" y="282.6" fill="#142F32" font-family="Arial" font-size="44" font-weight="700" text-anchor="start">when the wording changes?</text><text x="64" y="403.9" fill="#087F74" font-family="Arial" font-size="30" font-weight="700" text-anchor="start">01</text><line x1="64" y1="437" x2="399" y2="437" stroke="#D5DDD6" stroke-width="1"/><text x="64" y="489.9" fill="#142F32" font-family="Arial" font-size="30" font-weight="700" text-anchor="start">Insertion</text><text x="64" y="542.25" fill="#142F32" font-family="Arial" font-size="25" font-weight="400" text-anchor="start">The generator favors a secret</text><text x="64" y="572.75" fill="#142F32" font-family="Arial" font-size="25" font-weight="400" text-anchor="start">set of token choices.</text><text x="456" y="403.9" fill="#087F74" font-family="Arial" font-size="30" font-weight="700" text-anchor="start">02</text><line x1="456" y1="437" x2="791" y2="437" stroke="#D5DDD6" stroke-width="1"/><text x="456" y="489.9" fill="#142F32" font-family="Arial" font-size="30" font-weight="700" text-anchor="start">Rewriting</text><text x="456" y="542.25" fill="#142F32" font-family="Arial" font-size="25" font-weight="400" text-anchor="start">The attacker changes</text><text x="456" y="572.75" fill="#142F32" font-family="Arial" font-size="25" font-weight="400" text-anchor="start">wording without our</text><text x="456" y="603.25" fill="#142F32" font-family="Arial" font-size="25" font-weight="400" text-anchor="start">processor.</text><text x="848" y="403.9" fill="#087F74" font-family="Arial" font-size="30" font-weight="700" text-anchor="start">03</text><line x1="848" y1="437" x2="1183" y2="437" stroke="#D5DDD6" stroke-width="1"/><text x="848" y="489.9" fill="#142F32" font-family="Arial" font-size="30" font-weight="700" text-anchor="start">Detection</text><text x="848" y="542.25" fill="#142F32" font-family="Arial" font-size="25" font-weight="400" text-anchor="start">The detector reconstructs the</text><text x="848" y="572.75" fill="#142F32" font-family="Arial" font-size="25" font-weight="400" text-anchor="start">pattern with the same key.</text><text x="64" y="673.81" fill="#516865" font-family="Arial" font-size="17" font-weight="400" text-anchor="start">Baseline rationale: no retraining, explicit detection and measurable parameter tradeoffs</text><text x="1216" y="676.81" fill="#516865" font-family="Arial" font-size="17" font-weight="400" text-anchor="end">02</text></svg>