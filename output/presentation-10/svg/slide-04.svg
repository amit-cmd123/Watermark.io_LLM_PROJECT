<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#102E31"/><text x="64" y="102.78" fill="#FFFFFF" font-family="Arial" font-size="46" font-weight="700" text-anchor="start">The score measures excess favored choices</text><text x="64" y="222.27" fill="#B9E7CB" font-family="Arial" font-size="39" font-weight="700" text-anchor="start">z = (G − gamma × T) / √[T × gamma × (1 − gamma)]</text><text x="64" y="298.25" fill="#A8C6BE" font-family="Arial" font-size="25" font-weight="400" text-anchor="start">G = favored choices T = checked evidence units</text><text x="64" y="396.97" fill="#FFFFFF" font-family="Arial" font-size="29" font-weight="700" text-anchor="start">Marked original</text><text x="430" y="399.76" fill="#B9E7CB" font-family="Arial" font-size="32" font-weight="400" text-anchor="start">116 / 195</text><text x="918" y="406.64" fill="#B9E7CB" font-family="Arial" font-size="48" font-weight="700" text-anchor="start">11.12</text><line x1="64" y1="445" x2="1216" y2="445" stroke="#385654" stroke-width="1"/><text x="64" y="524.97" fill="#FFFFFF" font-family="Arial" font-size="29" font-weight="700" text-anchor="start">First rewrite</text><text x="430" y="527.76" fill="#E6C293" font-family="Arial" font-size="32" font-weight="400" text-anchor="start">48 / 194</text><text x="918" y="534.64" fill="#E6C293" font-family="Arial" font-size="48" font-weight="700" text-anchor="start">−0.08</text><line x1="64" y1="573" x2="1216" y2="573" stroke="#385654" stroke-width="1"/><text x="64" y="673.81" fill="#A8C6BE" font-family="Arial" font-size="17" font-weight="400" text-anchor="start">Cutoff = 4. Below cutoff means insufficient evidence for this pattern.</text><text x="1216" y="676.81" fill="#A8C6BE" font-family="Arial" font-size="17" font-weight="400" text-anchor="end">04</text></svg>