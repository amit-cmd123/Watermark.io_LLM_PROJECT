<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F4F3EC"/><text x="64" y="102.78" fill="#142F32" font-family="Arial" font-size="46" font-weight="700" text-anchor="start">The quality and validation gaps</text><text x="64" y="211.9" fill="#142F32" font-family="Arial" font-size="30" font-weight="700" text-anchor="start">Originals reaching the token cap</text><text x="76" y="293.04" fill="#087F74" font-family="Arial" font-size="28" font-weight="700" text-anchor="start">Method</text><text x="501" y="293.04" fill="#087F74" font-family="Arial" font-size="28" font-weight="700" text-anchor="start">Cap flags</text><line x1="64" y1="325" x2="719" y2="325" stroke="#D5DDD6" stroke-width="1"/><text x="76" y="363.04" fill="#142F32" font-family="Arial" font-size="28" font-weight="400" text-anchor="start">Baseline</text><text x="501" y="363.04" fill="#142F32" font-family="Arial" font-size="28" font-weight="400" text-anchor="start">9/60</text><line x1="64" y1="395" x2="719" y2="395" stroke="#D5DDD6" stroke-width="1"/><text x="76" y="433.04" fill="#142F32" font-family="Arial" font-size="28" font-weight="400" text-anchor="start">Stronger bias</text><text x="501" y="433.04" fill="#142F32" font-family="Arial" font-size="28" font-weight="400" text-anchor="start">25/60</text><line x1="64" y1="465" x2="719" y2="465" stroke="#D5DDD6" stroke-width="1"/><text x="76" y="503.04" fill="#142F32" font-family="Arial" font-size="28" font-weight="400" text-anchor="start">Fixed vocabulary</text><text x="501" y="503.04" fill="#142F32" font-family="Arial" font-size="28" font-weight="400" text-anchor="start">35/60</text><line x1="64" y1="535" x2="719" y2="535" stroke="#D5DDD6" stroke-width="1"/><text x="849" y="211.9" fill="#087F74" font-family="Arial" font-size="30" font-weight="700" text-anchor="start">Review still required</text><line x1="849" y1="248" x2="1216" y2="248" stroke="#D5DDD6" stroke-width="1"/><text x="849" y="287.25" fill="#142F32" font-family="Arial" font-size="25" font-weight="400" text-anchor="start">Meaning and claims</text><text x="849" y="317.75" fill="#142F32" font-family="Arial" font-size="25" font-weight="400" text-anchor="start">preservation</text><line x1="849" y1="328" x2="1216" y2="328" stroke="#D5DDD6" stroke-width="1"/><text x="849" y="367.25" fill="#142F32" font-family="Arial" font-size="25" font-weight="400" text-anchor="start">Human false-positive</text><text x="849" y="397.75" fill="#142F32" font-family="Arial" font-size="25" font-weight="400" text-anchor="start">calibration</text><line x1="849" y1="408" x2="1216" y2="408" stroke="#D5DDD6" stroke-width="1"/><text x="849" y="447.25" fill="#142F32" font-family="Arial" font-size="25" font-weight="400" text-anchor="start">Independent paraphrasers and</text><text x="849" y="477.75" fill="#142F32" font-family="Arial" font-size="25" font-weight="400" text-anchor="start">keys</text><line x1="849" y1="488" x2="1216" y2="488" stroke="#D5DDD6" stroke-width="1"/><text x="849" y="527.25" fill="#142F32" font-family="Arial" font-size="25" font-weight="400" text-anchor="start">Faithful semantic comparison</text><text x="64" y="625.48" fill="#087F74" font-family="Arial" font-size="36" font-weight="700" text-anchor="start">No validated robust winner yet</text><text x="64" y="673.81" fill="#516865" font-family="Arial" font-size="17" font-weight="400" text-anchor="start">Cap flags do not equal quality ratings. Current human-review count: 0.</text><text x="1216" y="676.81" fill="#516865" font-family="Arial" font-size="17" font-weight="400" text-anchor="end">09</text></svg>