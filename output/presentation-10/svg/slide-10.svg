<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#102E31"/><text x="64" y="102.78" fill="#FFFFFF" font-family="Arial" font-size="46" font-weight="700" text-anchor="start">The next milestone is a fair robustness gain</text><text x="64" y="223.71" fill="#B9E7CB" font-family="Arial" font-size="47" font-weight="700" text-anchor="start">More faithful rewrites detected,</text><text x="64" y="281.05" fill="#B9E7CB" font-family="Arial" font-size="47" font-weight="700" text-anchor="start">at a controlled error rate</text><text x="64" y="397.69" fill="#B9E7CB" font-family="Arial" font-size="33" font-weight="700" text-anchor="start">01</text><line x1="64" y1="438" x2="399" y2="438" stroke="#45615C" stroke-width="1"/><text x="64" y="494.97" fill="#FFFFFF" font-family="Arial" font-size="29" font-weight="700" text-anchor="start">Quality and calibration</text><text x="64" y="577.32" fill="#A8C6BE" font-family="Arial" font-size="24" font-weight="400" text-anchor="start">Review saved passages and</text><text x="64" y="606.6" fill="#A8C6BE" font-family="Arial" font-size="24" font-weight="400" text-anchor="start">collect human negatives.</text><text x="456" y="397.69" fill="#B9E7CB" font-family="Arial" font-size="33" font-weight="700" text-anchor="start">02</text><line x1="456" y1="438" x2="791" y2="438" stroke="#45615C" stroke-width="1"/><text x="456" y="494.97" fill="#FFFFFF" font-family="Arial" font-size="29" font-weight="700" text-anchor="start">Faithful alternative</text><text x="456" y="577.32" fill="#A8C6BE" font-family="Arial" font-size="24" font-weight="400" text-anchor="start">Integrate the semantic encoder</text><text x="456" y="606.6" fill="#A8C6BE" font-family="Arial" font-size="24" font-weight="400" text-anchor="start">and reference method.</text><text x="848" y="397.69" fill="#B9E7CB" font-family="Arial" font-size="33" font-weight="700" text-anchor="start">03</text><line x1="848" y1="438" x2="1183" y2="438" stroke="#45615C" stroke-width="1"/><text x="848" y="494.97" fill="#FFFFFF" font-family="Arial" font-size="29" font-weight="700" text-anchor="start">Independent</text><text x="848" y="530.35" fill="#FFFFFF" font-family="Arial" font-size="29" font-weight="700" text-anchor="start">confirmation</text><text x="848" y="577.32" fill="#A8C6BE" font-family="Arial" font-size="24" font-weight="400" text-anchor="start">Test new attacks, keys and</text><text x="848" y="606.6" fill="#A8C6BE" font-family="Arial" font-size="24" font-weight="400" text-anchor="start">models on fresh cases.</text><text x="64" y="673.81" fill="#A8C6BE" font-family="Arial" font-size="17" font-weight="400" text-anchor="start">Completed: insertion, inspection and local benchmark. Next: quality-aware comparison.</text><text x="1216" y="676.81" fill="#A8C6BE" font-family="Arial" font-size="17" font-weight="400" text-anchor="end">10</text></svg>