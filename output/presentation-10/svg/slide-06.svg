<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F4F3EC"/><text x="64" y="102.78" fill="#142F32" font-family="Arial" font-size="46" font-weight="700" text-anchor="start">The controlled local experiment</text><text x="64" y="232.78" fill="#087F74" font-family="Arial" font-size="46" font-weight="700" text-anchor="start">20 topics × 3 seeds × 3 methods</text><text x="64" y="298.04" fill="#142F32" font-family="Arial" font-size="28" font-weight="400" text-anchor="start">180 main cells, each with five scored conditions</text><text x="76" y="396.32" fill="#087F74" font-family="Arial" font-size="24" font-weight="700" text-anchor="start">Method</text><text x="486" y="396.32" fill="#087F74" font-family="Arial" font-size="24" font-weight="700" text-anchor="start">Partition</text><text x="966" y="396.32" fill="#087F74" font-family="Arial" font-size="24" font-weight="700" text-anchor="start">Bias</text><line x1="64" y1="424" x2="1216" y2="424" stroke="#D5DDD6" stroke-width="1"/><text x="76" y="458.32" fill="#142F32" font-family="Arial" font-size="24" font-weight="400" text-anchor="start">Baseline</text><text x="486" y="458.32" fill="#142F32" font-family="Arial" font-size="24" font-weight="400" text-anchor="start">Previous token</text><text x="966" y="458.32" fill="#142F32" font-family="Arial" font-size="24" font-weight="400" text-anchor="start">delta 2</text><line x1="64" y1="486" x2="1216" y2="486" stroke="#D5DDD6" stroke-width="1"/><text x="76" y="520.32" fill="#142F32" font-family="Arial" font-size="24" font-weight="400" text-anchor="start">Stronger bias</text><text x="486" y="520.32" fill="#142F32" font-family="Arial" font-size="24" font-weight="400" text-anchor="start">Previous token</text><text x="966" y="520.32" fill="#142F32" font-family="Arial" font-size="24" font-weight="400" text-anchor="start">delta 3</text><line x1="64" y1="548" x2="1216" y2="548" stroke="#D5DDD6" stroke-width="1"/><text x="76" y="582.32" fill="#142F32" font-family="Arial" font-size="24" font-weight="400" text-anchor="start">Fixed vocabulary</text><text x="486" y="582.32" fill="#142F32" font-family="Arial" font-size="24" font-weight="400" text-anchor="start">Constant partition</text><text x="966" y="582.32" fill="#142F32" font-family="Arial" font-size="24" font-weight="400" text-anchor="start">delta 3</text><line x1="64" y1="610" x2="1216" y2="610" stroke="#D5DDD6" stroke-width="1"/><text x="64" y="641.25" fill="#142F32" font-family="Arial" font-size="25" font-weight="700" text-anchor="start">Length sweep: 30 more cells at caps 128 and 512</text><text x="64" y="673.81" fill="#516865" font-family="Arial" font-size="17" font-weight="400" text-anchor="start">210 completed cells and 1,050 rows. Ordinary control text is shared across methods.</text><text x="1216" y="676.81" fill="#516865" font-family="Arial" font-size="17" font-weight="400" text-anchor="end">06</text></svg>