<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watermark Lab</title>
<meta name="description" content="Compare watermark schemes on speed, text quality and detection, and test your own text.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231b6c80'/%3E%3Cpath d='M7 20l5-8 4 6 3-4 6 8' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="frame">
  <aside class="side" aria-label="Sections">
    <div class="brand"><span class="mark" aria-hidden="true"></span><span>Watermark Lab</span></div>
    <nav class="nav" id="nav">
      <button data-view="results" class="on">Compare</button>
      <button data-view="generate">Generate &amp; compare</button>
      <button data-view="detect">Check text</button>
      <button data-view="attack">Rewrite test</button>
      <button data-view="runs">Runs</button>
    </nav>
    <div class="side-foot"><div class="chip" id="job-chip"><i></i><span>Idle</span></div></div>
  </aside>

  <header class="top">
    <button class="menu" id="menu" aria-label="Open sections">Menu</button>
    <span class="crumb" id="crumb">Compare</span>
    <span class="spacer"></span>
    <button class="ghost" id="cancel" hidden>Cancel job</button>
  </header>

  <main class="sheet">
    <section id="results" class="view">
      <div class="row-between wrap-gap">
        <h1>Compare schemes</h1>
        <details class="pop">
          <summary class="ghost">Run benchmark</summary>
          <div class="pop-body card">
            <label for="bench-limit">Prompts</label>
            <input id="bench-limit" type="number" min="1" max="20" value="20" title="Two seeds each. 20 prompts is roughly 25 minutes on the GPU.">
            <div class="actions"><button class="primary" id="run-bench">Start</button></div>
          </div>
        </details>
      </div>
      <div id="bench-out"></div>
    </section>

    <section id="bench" class="view" hidden>
      <h1 id="title">Generate &amp; compare</h1>
      <div class="card input-card">
        <div id="in-generate">
          <label for="prompt">Prompt</label>
          <textarea id="prompt" rows="3" placeholder="Explain how vaccines train the immune system."></textarea>
          <div class="chips" id="prompt-chips" aria-label="Example prompts"></div>
        </div>
        <div id="in-text" hidden>
          <div class="row-between"><label for="text">Text</label><button class="link" id="use-last" hidden>Paste watermarked sample</button></div>
          <textarea id="text" rows="7" placeholder="Paste text."></textarea>
          <div id="attack-pick" hidden>
            <label for="attack">Rewrite</label>
            <select id="attack">
              <option value="paraphrase">Paraphrase ×3</option>
              <option value="translation">French and back</option>
            </select>
          </div>
        </div>
        <div class="controls">
          <div>
            <label for="scheme">Scheme</label>
            <select id="scheme">
              <option value="v1">v1 · previous-token</option>
              <option value="v2-h1">v2 · hash, context 1</option>
              <option value="v2-h4">v2 · hash, context 4</option>
              <option value="v2-min4">v2 · min-hash, context 4</option>
            </select>
          </div>
          <div class="seg" role="group" aria-label="Mode">
            <button data-mode="real" class="on" title="Real language model">Text</button>
            <button data-mode="offline" title="Instant demo with an untrained model; output is token IDs">Demo</button>
          </div>
          <button class="primary" id="run">Generate &amp; compare</button>
        </div>
      </div>

      <details class="card settings" id="settings">
        <summary>Settings</summary>
        <div class="grid4">
          <div><label for="model">Model</label><input id="model" value="Qwen/Qwen2.5-0.5B-Instruct"></div>
          <div><label for="revision">Revision</label><input id="revision" value="main"></div>
          <div class="span2"><label for="key">Key <button class="link" id="newkey" type="button">New</button></label>
            <input id="key" class="mono" autocomplete="off" spellcheck="false"></div>
          <div><label for="gamma" title="Share of words that count as favored by chance">Green share</label><input id="gamma" type="number" step="0.05" min="0.01" max="0.99" value="0.25"></div>
          <div><label for="delta" title="How strongly favored words are boosted while writing">Strength</label><input id="delta" type="number" step="0.5" min="0" max="10" value="2"></div>
          <div><label for="threshold" title="Score at or above this counts as detected">Detect at z ≥</label><input id="threshold" type="number" step="0.5" min="0" max="20" value="4"></div>
          <div><label for="temperature">Temperature</label><input id="temperature" type="number" step="0.1" min="0.1" max="2" value="0.8"></div>
          <div><label for="top_p">Top-p</label><input id="top_p" type="number" step="0.05" min="0.01" max="1" value="0.95"></div>
          <div><label for="max_new_tokens">Max tokens</label><input id="max_new_tokens" type="number" step="16" min="16" max="512" value="256"></div>
          <div><label for="seed">Seed</label><input id="seed" type="number" min="0" value="1234"></div>
        </div>
      </details>

      <div id="out" aria-live="polite"><div id="result"></div></div>
    </section>

    <section id="runs" class="view" hidden>
      <div class="runs-grid">
        <div class="col-list">
          <div class="row-between"><h1>Runs</h1><button class="ghost" id="refresh">Refresh</button></div>
          <div id="run-list" class="run-list"></div>
          <details class="card settings">
            <summary>New experiment</summary>
            <label for="limit">Prompts</label>
            <input id="limit" type="number" min="1" max="20" value="1">
            <div class="actions"><button class="primary" id="run-exp">Start</button></div>
          </details>
        </div>
        <div class="col-detail" id="run-detail"></div>
      </div>
    </section>
  </main>
</div>

<aside class="toast card" id="job" hidden aria-live="polite">
  <div class="row-between"><strong id="job-title">Working</strong><span class="mono small" id="job-time"></span></div>
  <div class="bar"><i></i></div>
  <pre id="log"></pre>
</aside>
<script src="/app.js"></script>
</body>
</html>
